name: msg_platform
description: Privacy-first decentralized encrypted messaging
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  web_socket_channel: ^2.4.0
  
  sodium: ^2.1.0
  pointycastle: ^3.7.0
  
  sqflite: ^2.3.0
  encrypted_shared_preferences: ^3.0.0
  
  google_fonts: ^6.1.0
  gap: ^3.0.0
  
  uuid: ^4.0.0
  timeago: ^3.6.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
